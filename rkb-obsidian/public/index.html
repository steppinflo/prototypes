<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RKB Obsidian Portal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13z" fill="currentColor"/><path d="M16 8 23 12v8l-7 4-7-4v-8z" fill="var(--brand-inner)"/></svg>
        <span><strong>RKB Obsidian</strong><small>Inventory &amp; Fulfilment</small></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="dashboard"><span class="ico">◧</span>Dashboard<span class="nav-badge" id="task-badge"></span></a>
        <a href="#/planning" data-route="planning"><span class="ico">◔</span>Supply &amp; demand plan</a>
        <div class="nav-group">Fulfilment</div>
        <a href="#/orders" data-route="orders"><span class="ico">☰</span>Customer orders</a>
        <a href="#/tractors" data-route="tractors"><span class="ico">⚙</span>Tractors</a>
        <a href="#/shipping" data-route="shipping"><span class="ico">⇄</span>Shipping</a>
        <div class="nav-group">Supply</div>
        <a href="#/parts" data-route="parts"><span class="ico">▦</span>Parts inventory</a>
        <a href="#/purchasing" data-route="purchasing"><span class="ico">✎</span>Parts orders</a>
        <a href="#/suppliers" data-route="suppliers"><span class="ico">◇</span>Suppliers</a>
        <div class="nav-group">Quality &amp; accounts</div>
        <a href="#/quality" data-route="quality"><span class="ico">⚠</span>Failures &amp; issues</a>
        <a href="#/customers" data-route="customers"><span class="ico">☺</span>Customers</a>
        <a href="#/about" data-route="about"><span class="ico">ⓘ</span>How it works</a>
      </nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <form class="search" id="search-form" role="search">
          <input id="search" type="search" placeholder="Find order, tractor serial, part number, PO…" autocomplete="off">
        </form>
        <div class="topbar-right">
          <span class="today" id="today"></span>
          <button class="icon-btn" id="theme-btn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <dialog id="dialog" class="dialog"></dialog>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
